<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoSync — hors connexion</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#e6edf7;
         background: radial-gradient(1200px 600px at 10% -10%, #1b2c52 0%, transparent 55%),
                     radial-gradient(900px 500px at 110% 10%, #143042 0%, transparent 50%), #0b1220; }
  .card { max-width:360px; text-align:center; background:rgba(22,33,58,.85); border:1px solid rgba(148,163,184,.15);
          border-radius:22px; padding:34px 28px; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .ico { font-size:52px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 8px; font-weight:800; }
  p { color:#94a3b8; font-size:14px; line-height:1.6; margin:0 0 22px; }
  button { border:0; cursor:pointer; color:#fff; font-weight:700; font-size:15px; padding:13px 22px; border-radius:12px;
           background:linear-gradient(135deg,#4f8cff,#a78bfa); }
</style>
</head>
<body>
  <div class="card">
    <div class="ico">📴</div>
    <h1>Pas de connexion</h1>
    <p>PhotoSync a besoin d'Internet pour aller chercher tes photos sur le serveur. Reconnecte-toi au Wi-Fi ou aux données mobiles, puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
