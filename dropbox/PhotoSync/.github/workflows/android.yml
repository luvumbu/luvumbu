name: Build APK

# Compile l'APK à chaque push, et permet de lancer la compilation à la main
# (onglet "Actions" sur GitHub > "Build APK" > "Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK de debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK (téléchargeable dans les artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
