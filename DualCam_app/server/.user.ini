; Limites PHP relevées pour autoriser les gros fichiers (vidéos).
; Lu automatiquement par PHP-FPM / LiteSpeed (Hostinger). Prise en compte sous ~5 min.
; Si ton hébergeur impose un plafond plus bas, ajuste aussi dans hPanel > Configuration PHP.
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 1200
max_input_time = 1200
memory_limit = 512M
