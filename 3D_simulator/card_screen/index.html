<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Maps</title>

  <!-- Leaflet (gratuit, open source) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card__header">
      <h1 class="card__title">📍 Card Maps</h1>
      <form id="search-form" class="search">
        <input
          type="search"
          id="search-input"
          class="search__input"
          placeholder="Rechercher un lieu, une ville, une adresse…"
          autocomplete="off"
        />
        <button type="submit" class="search__btn" title="Rechercher">🔍</button>
        <button type="button" id="locate-btn" class="search__btn" title="Ma position">🎯</button>
        <button type="button" id="capture-btn" class="search__btn" title="Capturer la carte en image">📸</button>
        <select id="style" class="search__select"
                title="Style de la carte : chaque fond dessine autre chose (bâtiments, relief, photo…) — et la 3D se reconstruit à partir de ces couleurs."></select>
        <select id="detail" class="search__select"
                title="Niveau de détail de la capture : ×2 et ×4 vont chercher les tuiles d'un ou deux zooms plus fins — plus de rues, plus de bâtiments, une image 2 à 4 fois plus grande.">
          <option value="0">détail écran</option>
          <option value="1">détail ×2</option>
          <option value="2">détail ×4</option>
        </select>
        <!-- L'outil principal du projet manquait dans cette barre : on capturait sans
             pouvoir aller reconstruire. Il est en tête des liens, avant les deux pistes
             antérieures (dalle texturée, terrain de zones). -->
        <a href="echantillon.html" class="search__btn search__btn--fort"
           title="Reconstruire une capture en relief 3D (l'outil principal)"
           style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">🏔️</a>
        <a href="3d.html" class="search__btn" title="Voir les captures en 3D" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">🧊</a>
        <button type="button" id="relever" class="search__btn btn-noms" aria-pressed="false"
          title="Masquer les noms — le paysage reste identique (les noms sont relevés à part au 📸)">🏷️</button>
        <a href="zones.html" class="search__btn" title="Les zones en terrain 3D" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">🏝️</a>
      </form>
    </header>

    <div class="card__map-wrap">
      <div id="map" class="card__map"></div>
      <!-- Flash "appareil photo" : recouvre la carte le temps de l'éclair (jamais capturé) -->
      <div id="flash" class="flash"></div>
    </div>

    <footer class="card__footer">
      <span id="status" class="status">Recherchez un lieu ou cliquez sur la carte.</span>
      <!-- Apparaît après une capture : le chemin naturel est d'aller la reconstruire, autant
           le proposer là où on vient de la créer, avec son nom déjà transmis. -->
      <a id="traiter" class="traiter" hidden>🏔️ Traiter cette capture →</a>
      <span class="credit">Cartes © OpenStreetMap · Leaflet</span>
    </footer>

    <!-- Confirmation : hors de la zone carte, jamais capturée -->
    <div id="toast" class="toast">📸 Capturé ✔</div>
  </main>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>
</body>
</html>
