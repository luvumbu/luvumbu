<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#fff4e0;color:#3a2e2e;
       height:100vh;display:grid;place-items:center;text-align:center;margin:0;padding:1.5rem}
  .box{max-width:340px}.emoji{font-size:4rem}
  h1{font-size:1.4rem;margin:.5rem 0}p{opacity:.8;line-height:1.5}
  button{margin-top:1rem;border:none;background:#58cc02;color:#fff;font-weight:800;
         font-size:1.1rem;padding:.8rem 1.4rem;border-radius:14px}
</style></head>
<body><div class="box">
  <div class="emoji">📡🐣</div>
  <h1>Pas de connexion</h1>
  <p>Le Tamagotchi a besoin d'Internet pour se connecter au serveur. Vérifie ta connexion puis réessaie.</p>
  <button onclick="location.reload()">🔄 Réessayer</button>
</div></body></html>
